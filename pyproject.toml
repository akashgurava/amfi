[project]
name = "amfi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "duckdb>=1.0.0",
    "tqdm>=4.66.0",
    "polars[pyarrow]>=1.39.2",
    "seaborn>=0.13.2",
    "matplotlib>=3.10.8",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.11.0",
    "mypy>=1.12.0",
    "isort>=5.13.0",
    "types-tqdm>=4.67.0.20250809",
    "ipykernel>=7.2.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.10"
strict = true
exclude = ["tests/integration"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: tests that call live AMFI endpoints"]
